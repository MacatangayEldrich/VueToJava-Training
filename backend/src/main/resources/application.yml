
spring:
    application:
        name: backend
    datasource:
        url: jdbc:h2:mem:testdb
        username: sa
        password:
        driver-class-name: org.h2.Driver
    h2:
        console:
            enabled: true
            path: /h2-console
    sql:
        init:
            mode: always
    jpa:
        defer-datasource-initialization: true
        hibernate:
            ddl-auto: none

management:
    endpoint:
        health:
            show-details: always
    endpoints:
        web: 
            exposure:
                include: health